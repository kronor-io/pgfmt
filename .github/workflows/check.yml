name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

# GitHub-hosted runners only, as for every public kronor repository. Every job
# reads from the kronor-open cache and pushes what it builds there.
jobs:
  nix-matrix:
    name: Generate nix github actions matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: set-matrix
        name: Generate Nix Matrix
        run: |
          set -Eeu
          matrix="$(nix eval --json '.#githubActions.matrix')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # pgfmt and its test suites, on each system the flake supports.
  nix-build:
    name: pgfmt (${{ matrix.system }})
    needs: nix-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.nix-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build
        run: nix build -L .#packages."${MATRIX_SYSTEM}".pgfmt
        env:
          MATRIX_SYSTEM: ${{ matrix.system }}
      - name: Test
        run: nix build -L .#checks."${MATRIX_SYSTEM}".render .#checks."${MATRIX_SYSTEM}".file
        env:
          MATRIX_SYSTEM: ${{ matrix.system }}

  # TODO: static release tarballs on v* tags, as sqiff's scripts/build-static
  # does. pgfmt additionally needs libpg_query.a built against musl.
